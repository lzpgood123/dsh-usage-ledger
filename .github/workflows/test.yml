# CI：让 `npm test` 成为真实防线，而不是「全绿」的错觉。
#
# 本仓库零运行时依赖，测试用 Node 内置的 `node:test`，所以这里没有 `npm ci`。
# 唯一的外部输入是**宿主主题包**：`test/appearance.test.js` 要从全局安装里读它的
# `lib/client.js`（只当文本读，不 require），用来核对 token 存在性、色阶与对比度。
#
# 关键陷阱（这个 workflow 存在的理由）：主题包读不到时，appearance 的 16 条用例会
# `t.skip()` 而不是失败——`npm test` 依旧退出 0，CI 一片绿，但那 16 条**什么都没验证**。
# 所以下面那道「skipped 必须为 0」的闸门不是可选项，它是本文件的核心价值。

name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines 要求 >=22；22 与 24 都跑，覆盖宿主 zstd 能力的两个代际。
        node: ["22", "24"]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 只装主题包（5 个包），不装完整的 @deepseek-ai/dsh（520 个包，还带原生依赖）：
      # 测试只需要主题包的 lib/client.js 文本。--ignore-scripts 跳过 node-pty 之类的
      # 原生构建，让这一步稳定在秒级。
      #
      # 装完之后主题包落在 `<node 前缀>/lib/node_modules/@deepseek-ai/dsh-client-ui-theme/
      # lib/client.js`（扁平布局），正是测试候选列表里的第 3 条，测试自己也能反推出来。
      # 但这里仍然用 UL_THEME_PATH 显式指路：CI 的 Node 前缀由 setup-node 决定，
      # 与其依赖「反推一定对」，不如把路径算出来钉死——显式指路同时让「路径解析失败」
      # 在 CI 里不可能发生，闸门要拦的就只剩「主题包真的没装上」这一种真实情况。
      - name: 全局安装宿主主题包（钉死版本）
        run: |
          npm i -g --ignore-scripts @deepseek-ai/dsh-client-ui-theme@0.1.7-rc.2
          THEME="$(npm root -g)/@deepseek-ai/dsh-client-ui-theme/lib/client.js"
          if [ ! -f "$THEME" ]; then
            echo "::error::主题包装完后在 $THEME 找不到 client.js：下面的外观断言会全部 skip。"
            exit 1
          fi
          echo "UL_THEME_PATH=$THEME" >> "$GITHUB_ENV"
          echo "主题包已就位：$THEME"

      # 用 NODE_OPTIONS 追加一个 TAP reporter，把同一批用例额外导出一份机器可读的报告；
      # 不修改 package.json 里的 test 脚本。注意 reporter 参数必须排在测试文件通配符
      # **之前**（`npm test -- --test-reporter=...` 会把它追加到末尾，Node 那时已不再解析），
      # 所以走环境变量而不是 `--` 透传。
      # stdout 仍保留 spec reporter，失败时日志照样可读。
      # 显式列出测试文件，**排除** test/viewport.test.js。
      #
      # 那个文件要驱动真实 Chrome，在拿不到浏览器的环境里只能 skip；而本 job 下面
      # 那道「skipped 必须为 0」的闸门会因此把整个 job 判红——用「环境缺失」去否决
      # 一批本来能跑的用例，是错的。浏览器用例有自己的 job（`viewport`），
      # 那里 Chrome 缺失才算失败。
      #
      # 为什么不用 `node --test "test/**/*.test.js" "!test/viewport.test.js"`：
      # 已实测 Node 24 **不支持** glob 否定，那个 `!...` 参数被静默忽略，104 个用例
      # 照跑不误（含 viewport），闸门于是仍会被误杀。所以这里用 shell 算出显式列表。
      - name: 跑测试（并导出 TAP 报告）
        run: |
          FILES="$(ls test/*.test.js | grep -v 'test/viewport.test.js$' | tr '\n' ' ')"
          echo "本次执行的测试文件：$FILES"
          NODE_OPTIONS="--test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=$RUNNER_TEMP/test-results.tap" node --test $FILES

      # 闸门：skipped 必须为 0。
      #
      # 主题包缺失时 npm test 会**成功退出**，只是把 16 条外观断言记成 skipped——
      # 这正是「虚假安全感」。这里把 TAP 汇总行读出来，只要 skipped != 0 就失败，
      # 并把被跳过的用例与原因原样打印出来。
      # 同时要求报告存在、有 `# tests` / `# skipped` 汇总行、且用例数不为 0：
      # 否则「报告没生成」也会被当成 skipped==0 而假绿。
      - name: 闸门：skipped 必须为 0（否则 CI 失败）
        if: always()
        run: |
          REPORT="$RUNNER_TEMP/test-results.tap"

          if [ ! -s "$REPORT" ]; then
            echo "::error::没有拿到 TAP 报告（$REPORT）：测试可能根本没跑起来，无法证明 skipped==0。"
            exit 1
          fi

          # TAP 汇总行长这样：`# tests 94` / `# skipped 0`。取最后一条（存在多份时以最终汇总为准）。
          summary() {
            sed -n "s/^# $1 \([0-9][0-9]*\)\$/\1/p" "$REPORT" | tail -1
          }

          TESTS="$(summary tests)"
          SKIPPED="$(summary skipped)"
          FAILED="$(summary fail)"

          if [ -z "$TESTS" ] || [ -z "$SKIPPED" ] || [ -z "$FAILED" ]; then
            echo "::error::TAP 报告里找不到 \`# tests\` / \`# skipped\` / \`# fail\` 汇总行：报告格式变了，闸门无法判定，按失败处理。"
            sed -n '1,40p' "$REPORT"
            exit 1
          fi

          if [ "$TESTS" -eq 0 ]; then
            echo "::error::TAP 报告显示 0 个用例被执行：此时 skipped==0 毫无意义，按失败处理。"
            exit 1
          fi

          if [ "$SKIPPED" -ne 0 ]; then
            echo "::error::$SKIPPED 个用例被 skipped（共 $TESTS 个，失败 $FAILED 个）：外观回归正在静默退化，CI 不能算通过。"
            echo "--- 被跳过的用例 ---"
            grep '# SKIP' "$REPORT" | sed 's/^ok [0-9]* - //'
            echo "--- 最常见的原因：宿主主题包没装上，或装在了测试找不到的路径。"
            echo "--- 请检查上面的安装步骤，必要时用 UL_THEME_PATH 显式指路。"
            exit 1
          fi

          if [ "$FAILED" -ne 0 ]; then
            # 有失败用例时 `npm test` 那一步已经让 job 失败了；这里再显式失败一次，
            # 是为了让这道闸门的结论自洽——「skipped==0」不该以绿字收尾，
            # 也不该因为将来有人给测试步骤加上 continue-on-error 就漏掉真失败。
            echo "::error::skipped == 0，但有 $FAILED 个用例失败（共 $TESTS 个）：见上一步日志。"
            exit 1
          fi

          echo "skipped == 0：$TESTS 个用例全部真实执行，0 失败，0 跳过。"

  # 浏览器布局 job：与主 job 分开，理由见主 job 里那段注释。
  #
  # 这里反过来——**Chrome 起不来就是失败**，不能 skip。这个 job 存在的唯一意义
  # 就是量真实几何（面板是否被切出视口），量不到就等于没验证，所以断言
  # skipped === 0 并把 skipped 当成错误。
  viewport:
    name: 浏览器视口
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # ubuntu-latest 自带 google-chrome，无需额外安装。测试自己按
      # CHROME_BIN / CHROME_PATH / 常见绝对路径 / PATH 的顺序探测。
      - name: 确认 Chrome 可用（起不来就早失败，别等到 skip 被闸门抓到）
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::runner 上没有 google-chrome：视口断言将全部 skip，本 job 失去意义。"
            exit 1
          fi
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      - name: 跑视口测试（并导出 TAP 报告）
        run: |
          NODE_OPTIONS="--test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=$RUNNER_TEMP/viewport-results.tap" \
            node --test test/viewport.test.js

      # 闸门：这个 job 里 skipped 必须为 0 —— 与主 job 相反，这里 skip 是缺陷。
      - name: 闸门：视口用例一个都不许 skip
        if: always()
        run: |
          REPORT="$RUNNER_TEMP/viewport-results.tap"

          if [ ! -s "$REPORT" ]; then
            echo "::error::没有拿到 TAP 报告（$REPORT）：视口测试没跑起来。"
            exit 1
          fi

          summary() {
            sed -n "s/^# $1 \([0-9][0-9]*\)\$/\1/p" "$REPORT" | tail -1
          }

          TESTS="$(summary tests)"
          SKIPPED="$(summary skipped)"
          FAILED="$(summary fail)"

          if [ -z "$TESTS" ] || [ -z "$SKIPPED" ] || [ -z "$FAILED" ]; then
            echo "::error::TAP 报告里找不到汇总行，按失败处理。"
            sed -n '1,40p' "$REPORT"
            exit 1
          fi

          if [ "$TESTS" -eq 0 ]; then
            echo "::error::0 个用例被执行：视口断言没有真正运行。"
            exit 1
          fi

          if [ "$SKIPPED" -ne 0 ]; then
            echo "::error::$SKIPPED 个视口用例被 skipped（共 $TESTS 个）：本 job 里 skip 说明 Chrome 没起来或探测路径失效，等于没有验证。"
            grep '# SKIP' "$REPORT" | sed 's/^ok [0-9]* - //'
            exit 1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::$FAILED 个视口用例失败（共 $TESTS 个）：见上一步日志。"
            exit 1
          fi

          echo "视口：$TESTS 个用例全部真实执行，0 失败，0 跳过。"

  # 变异检查 job：证明「测试真的在守行为」，而不是碰巧全绿。
  #
  # 为什么独立成 job：
  # - 它慢（本机 3s，CI 上随机器放大），不该拖慢主测试 job；
  # - 它要写临时目录、复制仓库再改坏源码，与主 job 的干净环境不同；
  # - 它验证的是**测试的质量**，不是代码的功能——两者失败时的排查方向不同。
  #
  # 它**不是** `npm test` 的替代品：`npm test` 说「代码现在是对的」，
  # 这个 job 说「测试真的抓得住错」。两者都要有。
  mutation:
    name: 变异检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 必须装宿主主题包，否则这个 job 一定失败——而且是有意失败：
      # test/appearance.test.js 读不到主题包时那 16 条会 skip，而 skip 会让
      # `node --test` 非 0 退出，于是每个变异体都会被误判成 KILLED。脚本在
      # 基线阶段就硬断言 skipped === 0 并拒绝继续，正是为了挡住这种虚假安全感。
      # 缺主题包还会让 4 个变异体（token / opacity / 阴影）无法判定。
      - name: 全局安装宿主主题包（钉死版本）
        run: |
          npm i -g --ignore-scripts @deepseek-ai/dsh-client-ui-theme@0.1.7-rc.2
          THEME="$(npm root -g)/@deepseek-ai/dsh-client-ui-theme/lib/client.js"
          if [ ! -f "$THEME" ]; then
            echo "::error::主题包装完后在 $THEME 找不到 client.js：appearance 用例会全部 skip，变异检查将在基线阶段失败。"
            exit 1
          fi
          echo "UL_THEME_PATH=$THEME" >> "$GITHUB_ENV"

      # 不需要再套一层 skipped===0 的 shell 闸门：脚本自己已经在基线阶段
      # 与每个变异体阶段各断言一次（skip ≠ 0 直接报错，绝不算 KILLED），
      # 退出码语义已经覆盖。重复加闸门只会多一个会漂移的地方。
      - name: 跑变异检查
        run: npm run mutate
